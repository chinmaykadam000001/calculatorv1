<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="{{url_for('static' , filename='style.css')}}">
</head>
<body>

    <h1>Welcome to My First Calculator</h1>
    <p>Enter the numbers in their respective boxes</p>

    <form method="POST" action="/cal">
        <label for="number1">Enter Number One:</label>
        <input type="number" id="number1" name="number1" placeholder="e.g., 5" required>

        <label for="number2">Enter Number Two:</label>
        <input type="number" id="number2" name="number2" placeholder="e.g., 6" required>

        <label for="operator">Enter the operator:</label>
        <input type="text" id="operator" name="operator" placeholder="e.g., +, -, *, /" required>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
